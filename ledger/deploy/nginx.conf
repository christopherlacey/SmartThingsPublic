# nginx equivalent of apache-vhost.conf, if the host ever moves off Apache.
#
# Same principle: the root is ledger/public, and everything private lives above
# it. The deny blocks are a second line of defence, not the mechanism.

server {
    listen 80;
    server_name c.lacey.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name c.lacey.me;

    root /var/www/ledger/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/c.lacey.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/c.lacey.me/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # See the Apache file for why includeSubDomains is not set here.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;

        # Without this, a request for /assets/foo.png/x.php can be made to
        # execute an uploaded file. This app has no uploads, but the setting
        # costs nothing and removes the class entirely.
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        try_files $uri =404;
    }

    location ~* \.(sqlite|sqlite-wal|sqlite-shm|sql|log|md|example)$ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }
}
