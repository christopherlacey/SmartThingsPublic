# Apache vhost for c.lacey.me
#
# The single most important line in this file is DocumentRoot: it must point at
# ledger/public, never at ledger/ itself. Everything the application needs to
# keep private — config.php with the location token, the SQLite file with the
# medical and financial records, src/, bin/ — lives one level above the docroot
# and is therefore unreachable over HTTP by construction rather than by rule.
#
# Deny rules are still here as a second line of defence, for the case where
# someone later moves the docroot up a level "to make a path work".
#
#   a2enmod headers rewrite ssl
#   a2ensite c.lacey.me && systemctl reload apache2
#
# Then confirm with: ./deploy.sh --check

<VirtualHost *:80>
    ServerName c.lacey.me

    # Nothing is served over plain HTTP. A dashboard of medical records has no
    # business answering an unencrypted request, even to redirect a form post.
    Redirect permanent / https://c.lacey.me/
</VirtualHost>

<VirtualHost *:443>
    ServerName c.lacey.me

    DocumentRoot /var/www/ledger/public

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/c.lacey.me/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/c.lacey.me/privkey.pem
    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder     off

    <Directory /var/www/ledger/public>
        Options -Indexes -ExecCGI +FollowSymLinks
        AllowOverride None
        Require all granted

        # No directory listings, ever. An index of /assets is harmless; an index
        # of anything else is a map of the application.
        DirectoryIndex index.php
    </Directory>

    # Belt and braces: even if the docroot is ever moved up a level, these
    # never become fetchable.
    <FilesMatch "\.(sqlite|sqlite-wal|sqlite-shm|sql|log|md|example)$">
        Require all denied
    </FilesMatch>

    <Files "config.php">
        Require all denied
    </Files>

    # Dotfiles, editor leftovers and the git directory.
    <DirectoryMatch "/\.(git|svn|hg)">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "(^\.|~$|\.bak$|\.orig$|\.save$|\.swp$)">
        Require all denied
    </FilesMatch>

    # HSTS. The application sends this too, but a header set here also covers
    # responses Apache generates itself — its 404s and 403s — which PHP never
    # sees.
    #
    # Deliberately no includeSubDomains: this host is one of several on
    # lacey.me, and committing every sibling to HTTPS-only from here would be a
    # decision made in the wrong place. Add it once you know every *.lacey.me
    # host is HTTPS-only, and only then consider preload — preload is
    # effectively irreversible.
    Header always set Strict-Transport-Security "max-age=31536000"

    # These are also sent by the application. Repeating them here means an
    # Apache-generated error page carries them as well.
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"

    # Never let a record end up in a shared cache.
    Header always set Cache-Control "no-store, no-cache, must-revalidate, private"

    # Don't advertise the PHP version.
    Header always unset X-Powered-By
    ServerSignature Off
    ServerTokens Prod

    ErrorLog  ${APACHE_LOG_DIR}/ledger-error.log

    # The access log records every URL requested. person.php?id=13 in a log is a
    # weaker leak than the page itself, but it is still a record of who was
    # looked at and when — keep the retention short and the file unreadable to
    # anyone but you.
    CustomLog ${APACHE_LOG_DIR}/ledger-access.log combined
</VirtualHost>
